<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f0" />
    <meta name="description" content="LiftPath 4.0 — Guided Coach cho onboarding, readiness, ghi set và progression có giải thích." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LiftPath 4.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%app-icon.svg?v=4" />
    <link rel="apple-touch-icon" href="%BASE_URL%app-icon.svg?v=4" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <script>
      (() => {
        try {
          const current = JSON.parse(localStorage.getItem("liftpath-personal-v4") || "null");
          const v3 = JSON.parse(localStorage.getItem("liftpath-personal-v3") || "null");
          const legacy = JSON.parse(localStorage.getItem("liftpath-personal-v2") || "null");
          const preference = current?.settings?.theme || v3?.settings?.theme || legacy?.settings?.theme || "system";
          const resolved = preference === "system"
            ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : preference;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", resolved === "dark" ? "#0b0e13" : "#f3f5f0");
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <title>LiftPath 4.0 — Guided Progression Coach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
