name: Refresh patched PostCSS lockfile

on:
  push:
    branches: [agent/liftpath-4-guided-coach]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/liftpath-4-guided-coach
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify patched version
        run: node -e "const lock=require('./package-lock.json'); const version=lock.packages?.['node_modules/postcss']?.version; if(version!=='8.5.23') throw new Error('Expected postcss 8.5.23, got '+version);"
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for patched PostCSS"
          git push origin HEAD:agent/liftpath-4-guided-coach
