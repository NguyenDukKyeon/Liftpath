name: Phase B supporting screens checks

on:
  push:
    branches:
      - agent/liftpath-4-2-supporting-screens-redesign
  workflow_dispatch:

concurrency:
  group: phase-b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify diff integrity
        run: git diff --check 6a4c1fd25fd8a477abfc0fdab46e1cd0c0dbeff9...HEAD
      - run: npm ci
      - run: npm run audit:production
      - run: npm run check:fast

  browser:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Critical browser flows
        run: npm run test:e2e
      - name: Accessibility and responsive checks
        run: npm run test:a11y
      - name: Simulated device and PWA regression
        run: npm run test:d2
      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-playwright-report
          path: |
            playwright-report
            playwright-report-d2
            test-results
            test-results-d2
          if-no-files-found: ignore
          retention-days: 14
