name: Apply LiftPath v3 payload

on:
  push:
    branches: [agent/liftpath-v3-platform]
    paths:
      - v3-payload.ready

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/liftpath-v3-platform
          fetch-depth: 0
      - name: Verify and extract payload
        shell: bash
        run: |
          cat .v3-payload/part-* | base64 --decode > /tmp/liftpath-v3.tar.gz
          echo "31f334fca1a6269b1d433e1912c76ee35cb72b9b73e599d1fd3262ad92a7c225  /tmp/liftpath-v3.tar.gz" | sha256sum -c -
          tar -xzf /tmp/liftpath-v3.tar.gz -C .
          rm -rf .v3-payload v3-payload.ready
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement LiftPath 3.0 platform"
          git push origin HEAD:agent/liftpath-v3-platform
