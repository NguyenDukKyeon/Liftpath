name: Redesign branch checks

on:
  push:
    branches:
      - agent/liftpath-4-1-ui-ux-redesign

concurrency:
  group: redesign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify diff integrity
        run: git diff --check 4f89213a41a6ffb6a47673ba8f86d97aa3e58631...HEAD
      - run: npm ci
      - run: npm run audit:production
      - run: npm run check:fast

  browser:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Critical browser flows
        run: npm run test:e2e
      - name: Accessibility and responsive checks
        run: npm run test:a11y
      - name: Simulated device and PWA regression
        run: npm run test:d2
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redesign-playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
